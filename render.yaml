services:
  - type: web
    name: studio-prompt
    runtime: node
    plan: starter
    region: frankfurt
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: GEN_DIR
        value: /var/data/generated
      - key: APP_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AGNES_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MANUS_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: STUDIO_PROMPT_USER_ID
        value: online
    disk:
      name: studio-prompt-data
      mountPath: /var/data
      sizeGB: 10
