<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Écran de direct · Studio Prompt</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E7C66'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23D4AF37'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Baloo+2:wght@600;700&display=swap">
<style>
/* Écran de direct : la voix d'un projet « Garder la voix » joue, l'habillage est dessiné en temps réel.
   À mettre dans OBS Studio (source « Navigateur ») ou à capturer dans TikTok LIVE Studio (« Capture de fenêtre »). */
:root{--bg:#000;--ink:#F6EFE0;--gold:#D4AF37}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:"Cormorant Garamond",Georgia,serif}
#cv{position:absolute;inset:0;margin:auto;display:block}
body.idle{cursor:none}
.over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;text-align:center;background:rgba(0,0,0,.55)}
.over[hidden]{display:none}
#go{font:inherit;font-size:24px;font-weight:700;color:#1a1204;background:var(--gold);border:0;border-radius:999px;padding:16px 32px;min-height:56px;cursor:pointer}
#msg{font-size:20px;max-width:640px;line-height:1.4;margin:0}
</style>
</head>
<body>
<canvas id="cv" role="img" aria-label="Écran de direct"></canvas>
<div class="over" id="start"><button type="button" id="go">▶ Démarrer le direct</button><p id="msg">Chargement…</p></div>
<audio id="voix" preload="auto"></audio>
<audio id="amb" preload="auto" loop></audio>
<script src="studio-fx.js"></script>
<script src="recitation-fx.js"></script>
<script>
(function(){
"use strict";
const q=new URLSearchParams(location.search), id=q.get("id")||"", loop=q.get("boucle")==="1", $=x=>document.getElementById(x);
const cv=$("cv"), g=cv.getContext("2d"), voix=$("voix"), amb=$("amb"), msg=$("msg"), go=$("go");
let P=null, st=null, raf=0;
const say=t=>{ msg.textContent=t; };
/* le moteur dessine en 720p logique, multiplié selon la taille de la fenêtre (net dans OBS en 1080p) */
function build(){ if(!P) return; const V=P.fmt==="9:16", Q=P.fmt==="1:1", W=V?720:Q?720:1280, H=V?1280:720, dpr=window.devicePixelRatio||1, K=Math.min(3,Math.max(.5,Math.min(innerWidth/W,innerHeight/H)*dpr));
  st=SP_RECIT.stage({fmt:P.fmt, K, theme:(q.get("theme")||P.theme), items:P.items||[], sourate:P.sourate, fixe:P.fixe, recitant:P.recitant, showTr:P.showTr, total:loop?0:P.duration, subtitle:P.subtitle, transition:P.transition, palette:P.palette, animation:P.animation, effect:P.effect, syncOffset:P.syncOffset});
  cv.width=st.canvas.width; cv.height=st.canvas.height; const sc=Math.min(innerWidth/W,innerHeight/H); cv.style.width=Math.round(W*sc)+"px"; cv.style.height=Math.round(H*sc)+"px"; draw(); }
function draw(){ if(!st) return; st.draw(voix.currentTime||0); g.drawImage(st.canvas,0,0); }
function tick(){ draw(); raf=requestAnimationFrame(tick); }
async function start(){ try{ await voix.play(); if(P.amb){ amb.volume=Math.max(0,Math.min(.4,+P.vol||.08)); amb.play().catch(()=>{}); } $("start").hidden=true; cancelAnimationFrame(raf); tick(); }
  catch(e){ $("start").hidden=false; say("Clique sur « Démarrer » (le navigateur demande un clic avant de jouer le son). Dans OBS, le direct démarre tout seul."); } }
voix.addEventListener("ended", ()=>{ if(!loop){ cancelAnimationFrame(raf); draw(); } });
go.addEventListener("click", start);
document.addEventListener("keydown", e=>{ if(e.code==="Space"){ e.preventDefault(); if(voix.paused) start(); else { voix.pause(); amb.pause(); } } else if(e.key==="f"||e.key==="F"){ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); else document.documentElement.requestFullscreen().catch(()=>{}); } });
let rt=0; addEventListener("resize", ()=>{ clearTimeout(rt); rt=setTimeout(build,200); });
let it=0; addEventListener("mousemove", ()=>{ document.body.classList.remove("idle"); clearTimeout(it); it=setTimeout(()=>document.body.classList.add("idle"),2000); });
(async()=>{
  if(!/^[a-f0-9]{12}$/.test(id)){ say("Adresse incomplète : ouvre l’écran de direct depuis Studio Prompt, page « Garder la voix », étape 6."); go.hidden=true; return; }
  try{ const r=await fetch(`/api/recit/project?id=${id}`); if(!r.ok) throw new Error(String(r.status)); P=await r.json(); }
  catch(e){ say("Projet introuvable : ce direct marche avec Studio Prompt ouvert sur ton ordinateur (http://localhost:3000)."); go.hidden=true; return; }
  voix.src=P.audio; voix.loop=loop; if(P.amb) amb.src=`/generated/recit-${id}/ambiance.wav?k=${encodeURIComponent(P.amb)}`;
  await SP_RECIT.ready(); build(); say(`${P.nom||"Direct"} · prêt`); start();
})();
})();
</script>
</body>
</html>
